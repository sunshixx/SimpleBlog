<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作 - SUN Notes</title>
<link rel="icon" href="css/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="css/lwn.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  .editor-page { max-width: 900px; margin: 0 auto; padding: 0.5em; }
  .editor-form label { display:block; font-weight:bold; margin-top:0.8em; margin-bottom:0.3em; }
  .editor-form input[type=text] {
    width:100%; padding:6px; border:1px solid var(--FormBG);
    border-radius:0.5em; font-size:medium; box-sizing:border-box;
  }
  .editor-form textarea {
    width:100%; height:100%; min-height:0; padding:8px; border:1px solid var(--FormBG);
    border-radius:0.5em; font-family:monospace; font-size:14px; box-sizing:border-box;
    resize:none; overflow-y:auto;
  }
  .autocomplete-wrap { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
  .autocomplete-list {
    display:none; position:absolute; z-index:5; left:8px; bottom:8px;
    min-width:180px; max-width:calc(100% - 16px); max-height:180px;
    overflow-y:auto; background:var(--PageBG); color:var(--TextColor);
    border:1px solid var(--FormBG); box-shadow:2px 2px 5px rgba(0,0,0,0.18);
  }
  .autocomplete-list.visible { display:block; }
  .autocomplete-item { padding:3px 7px; cursor:pointer; white-space:pre; font-family:monospace; }
  .autocomplete-item.active, .autocomplete-item:hover { background:var(--HeadlineBG); }
  .row2 { display:flex; gap:1em; }
  .row2 > div { flex:1; }
  .editor-split {
    display:flex; gap:1em; margin-top:0.3em; align-items:stretch;
    height:min(75vh, 900px); min-height:320px;
  }
  .editor-split > div { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; }
  .preview-box {
    flex:1; min-height:0;
    border:1px solid var(--FormBG); border-radius:0.5em; padding:8px;
    overflow-y:auto; background:var(--MidColBG); box-sizing:border-box;
  }
  .preview-label { font-size:small; color:var(--VLinkColor); margin-bottom:4px; }
  .btn-row { margin-top:1em; }
  .btn {
    background:var(--ButtonColor); border:none; border-radius:0.5em;
    padding:8px 20px; font-size:medium; font-weight:bold; cursor:pointer;
    margin-right:0.5em;
  }
  .btn:hover { background:var(--ButtonHoverColor); }
  .btn.danger { background:#e84; color:#fff; }
  .list-item {
    padding:0.5em; border-bottom:1px solid var(--FormBG);
    display:flex; justify-content:space-between; align-items:center;
  }
  .list-item:hover { background:var(--FormBG); }
  .draft-item { color:#a33; border-left:3px solid #a33; background:#fff7f7; }
  .draft-item:hover { background:#fcecec; }
  .draft-item .Smaller { color:#a33; }
  .list-item .act a { margin-left:0.5em; font-size:small; }
  /* 正在编辑的文章高亮 */
  .list-item.editing {
    background:var(--HeadlineBG);
    border-left:3px solid var(--LinkColor);
  }
  .list-item.editing-dirty { border-left:3px solid #c33; }
  /* 评论管理面板 */
  .comment-mgr {
    width:100%; margin-top:0.4em; padding:0.4em 0.6em;
    background:var(--MidColBG); border:1px solid var(--FormBG); border-radius:0.4em;
  }
  .comment-mgr-item {
    padding:0.3em 0; border-bottom:1px dashed var(--FormBG);
  }
  .comment-mgr-item:last-child { border-bottom:none; }
  .comment-mgr-body {
    color:var(--VLinkColor); font-size:small; white-space:pre-wrap;
    margin-top:0.2em; margin-left:0.4em;
  }
  .login-box {
    max-width:280px; margin:4em auto; text-align:center;
    background:var(--NewLeftColBG); padding:2em; border-radius:1em;
  }
  .login-box input { width:100%; margin:0.4em 0; padding:8px; box-sizing:border-box; }
  .msg { padding:0.5em; margin:0.5em 0; border-radius:0.5em; font-size:small; }
  .msg.ok { background:#d4edda; color:#155724; }
  .msg.err { background:#f8d7da; color:#721c24; }
  .msg.info { background:var(--FormBG); color:var(--VLinkColor); }

  /* 插入图片工具条：朴素原生 form 风格，无桃色按钮 */
  .insert-toolbar {
    margin:0.4em 0; display:flex; flex-wrap:wrap; gap:0.4em;
    align-items:center; font-size:small;
  }
  .insert-toolbar .Smaller code { background:var(--FormBG); padding:0 3px; border-radius:2px; }
  .insert-toolbar input[type=text] {
    width:120px; font-size:small; padding:2px 4px;
    border:1px solid var(--FormBG);
  }
</style>
</head>
<body data-page="admin">
<a name="t"></a>
<script src="js/marked.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/admin.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</body>
</html>
